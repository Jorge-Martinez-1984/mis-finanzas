<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Control de Finanzas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }

    /* Navegación Inferior */
    .nav-bar {
      position: fixed; bottom: 0; width: 100%; background-color: var(--card-bg);
      display: flex; justify-content: space-around; border-top: 1px solid var(--border-color); z-index: 100;
    }
    .nav-btn {
      background: none; border: none; color: var(--text-muted); padding: 12px 5px;
      font-size: 11px; flex-grow: 1; text-align: center; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent-blue); font-weight: bold; border-top: 2px solid var(--accent-blue); }

    /* Secciones */
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* Tarjetas del Dashboard */
    .card {
      background-color: var(--card-bg); border-radius: 12px; padding: 16px;
      margin-bottom: 16px; border: 1px solid var(--border-color);
    }
    .card-title { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .card-value { font-size: 28px; font-weight: bold; }
    .card-value.green { color: var(--accent-green); }
    .card-value.red { color: var(--accent-red); }

    /* Botones de Acción */
    .action-btns { display: flex; gap: 12px; margin-bottom: 16px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold;
      color: white; cursor: pointer; text-align: center; font-size: 15px;
    }
    .btn-green { background-color: var(--accent-green); }
    .btn-red { background-color: var(--accent-red); }

    /* Listas y Formularios */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
      background-color: #2a2a2a; color: white; font-size: 14px;
    }
    .list-item {
      background-color: var(--card-bg); padding: 12px; border-radius: 8px;
      margin-bottom: 8px; border: 1px solid var(--border-color); display: flex;
      justify-content: space-between; align-items: center;
    }
    .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: DASHBOARD -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="card">
      <div class="card-title">Monto Total Disponible</div>
      <div class="card-value green" id="total-saldo">$0</div>
    </div>

    <div class="card">
      <div class="card-title">Gastos de este Mes</div>
      <div class="card-value red" id="total-gastos-mes">$0</div>
    </div>

    <div class="action-btns">
      <button class="btn btn-green" onclick="mostrarModal('ingreso')">+ Ingreso</button>
      <button class="btn btn-red" onclick="mostrarModal('egreso')">- Egreso</button>
    </div>

    <div class="card">
      <div class="card-title">Distribución de Gastos (Mes Actual)</div>
      <canvas id="gastosChart" style="max-height: 220px;"></canvas>
    </div>
  </div>

  <!-- PANTALLA 2: HISTORIAL INGRESOS -->
  <div id="tab-ingresos" class="tab-content">
    <div class="card-title" style="margin-bottom: 12px;">Histórico de Ingresos</div>
    <div class="form-group">
      <input type="text" id="busca-ingreso" placeholder="Buscar por etiqueta u observación..." onkeyup="filtrarHistorial('ingreso')">
    </div>
    <div id="lista-ingresos"></div>
  </div>

  <!-- PANTALLA 3: HISTORIAL EGRESOS -->
  <div id="tab-egresos" class="tab-content">
    <div class="card-title" style="margin-bottom: 12px;">Histórico de Egresos</div>
    <div class="form-group">
      <input type="text" id="busca-egreso" placeholder="Buscar por etiqueta u observación..." onkeyup="filtrarHistorial('egreso')">
    </div>
    <div id="lista-egresos"></div>
  </div>

  <!-- PANTALLA 4: AHORROS -->
  <div id="tab-ahorros" class="tab-content">
    <div class="card">
      <div class="card-title">Meta de Ahorro Deseada</div>
      <div class="card-value" style="color: var(--accent-blue);" id="meta-monto">$1.000.000</div>
    </div>

    <div class="card">
      <div class="card-title">Ahorrado Actualmente</div>
      <div class="card-value green" id="total-ahorrado">$0</div>
    </div>

    <div class="form-group">
      <button class="btn btn-green" style="background-color: var(--accent-blue);" onclick="mostrarModal('ahorro')">+ Aportar a Ahorro</button>
    </div>

    <div class="card-title" style="margin-top: 20px; margin-bottom: 8px;">Historial de Aportes</div>
    <div id="lista-ahorros"></div>
  </div>

  <!-- MODAL / FORMULARIO RÁPIDO DE REGISTRO -->
  <div id="modal-registro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:200; padding:20px;">
    <div class="card" style="margin-top: 40px;">
      <h3 id="modal-titulo" style="margin-bottom: 16px;">Registrar Movimiento</h3>
      
      <div class="form-group">
        <label>Monto</label>
        <input type="number" id="reg-monto" placeholder="Ej: 5000" inputmode="numeric">
      </div>

      <div class="form-group" id="group-etiqueta">
        <label>Etiqueta / Categoría</label>
        <input type="text" id="reg-etiqueta" list="etiquetas-default" placeholder="Escribe o selecciona...">
        <datalist id="etiquetas-default">
          <option value="Locomoción"><option value="Tarjeta"><option value="Casa"><option value="Ocio"><option value="Facturas">
        </datalist>
      </div>

      <div class="form-group">
        <label>Observación (Opcional)</label>
        <input type="text" id="reg-obs" placeholder="Ej: Pasaje o detalle...">
      </div>

      <div class="action-btns">
        <button class="btn btn-green" onclick="guardarMovimiento()">Guardar</button>
        <button class="btn btn-red" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="cambiarTab('dashboard', this)">Dashboard</button>
    <button class="nav-btn" onclick="cambiarTab('ingresos', this)">Ingresos</button>
    <button class="nav-btn" onclick="cambiarTab('egresos', this)">Egresos</button>
    <button class="nav-btn" onclick="cambiarTab('ahorros', this)">Ahorros</button>
  </div>

  <script>
    let tipoActual = '';
    let db = JSON.parse(localStorage.getItem('finanzas_db')) || {
      movimientos: [],
      metaAhorro: 1000000
    };

    let chartInstance = null;

    function guardarDB() {
      localStorage.setItem('finanzas_db', JSON.stringify(db));
      actualizarInterfaz();
    }

    function cambiarTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      element.classList.add('active');
    }

    function mostrarModal(tipo) {
      tipoActual = tipo;
      document.getElementById('modal-titulo').innerText = 'Registrar ' + tipo.toUpperCase();
      document.getElementById('group-etiqueta').style.display = tipo === 'ahorro' ? 'none' : 'block';
      document.getElementById('modal-registro').style.display = 'block';
    }

    function cerrarModal() {
      document.getElementById('modal-registro').style.display = 'none';
      document.getElementById('reg-monto').value = '';
      document.getElementById('reg-etiqueta').value = '';
      document.getElementById('reg-obs').value = '';
    }

    function guardarMovimiento() {
      const monto = parseFloat(document.getElementById('reg-monto').value);
      const etiqueta = document.getElementById('reg-etiqueta').value || 'General';
      const obs = document.getElementById('reg-obs').value;

      if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }

      const nuevoReg = {
        id: Date.now(),
        fecha: new Date().toISOString(),
        tipo: tipoActual,
        monto: monto,
        etiqueta: etiqueta,
        obs: obs
      };

      db.movimientos.push(nuevoReg);
      guardarDB();
      cerrarModal();
    }

    function actualizarInterfaz() {
      const ahora = new Date();
      const mesActual = ahora.getMonth();
      const anoActual = ahora.getFullYear();

      let saldoTotal = 0;
      let gastosMes = 0;
      let totalAhorrado = 0;
      let gastosPorEtiqueta = {};

      document.getElementById('lista-ingresos').innerHTML = '';
      document.getElementById('lista-egresos').innerHTML = '';
      document.getElementById('lista-ahorros').innerHTML = '';

      db.movimientos.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(m => {
        const f = new Date(m.fecha);
        const fechaFormateada = f.toLocaleDateString() + ' ' + f.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        // Cálculo de Saldos
        if (m.tipo === 'ingreso') {
          saldoTotal += m.monto;
          renderItem('lista-ingresos', m, fechaFormateada);
        } else if (m.tipo === 'egreso') {
          saldoTotal -= m.monto;
          renderItem('lista-egresos', m, fechaFormateada);

          // Filtro solo para el MES ACTUAL
          if (f.getMonth() === mesActual && f.getFullYear() === anoActual) {
            gastosMes += m.monto;
            gastosPorEtiqueta[m.etiqueta] = (gastosPorEtiqueta[m.etiqueta] || 0) + m.monto;
          }
        } else if (m.tipo === 'ahorro') {
          saldoTotal -= m.monto; // Sale de la cuenta general
          totalAhorrado += m.monto;
          renderItem('lista-ahorros', m, fechaFormateada);
        }
      });

      document.getElementById('total-saldo').innerText = '$' + saldoTotal.toLocaleString();
      document.getElementById('total-gastos-mes').innerText = '$' + gastosMes.toLocaleString();
      document.getElementById('total-ahorrado').innerText = '$' + totalAhorrado.toLocaleString();

      actualizarGrafico(gastosPorEtiqueta);
    }

    function renderItem(contenedorId, m, fecha) {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <div>
          <strong>${m.etiqueta || 'Ahorro'}</strong>
          <div class="item-meta">${fecha} ${m.obs ? ' - ' + m.obs : ''}</div>
        </div>
        <div style="font-weight:bold;">$${m.monto.toLocaleString()}</div>
      `;
      document.getElementById(contenedorId).appendChild(div);
    }

    function actualizarGrafico(datos) {
      const ctx = document.getElementById('gastosChart').getContext('2d');
      const labels = Object.keys(datos);
      const values = Object.values(datos);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#e0e0e0' } } }
        }
      });
    }

    function filtrarHistorial(tipo) {
      const query = document.getElementById('busca-' + tipo).value.toLowerCase();
      const contenedor = document.getElementById('lista-' + tipo);
      Array.from(contenedor.children).forEach(item => {
        const texto = item.innerText.toLowerCase();
        item.style.display = texto.includes(query) ? 'flex' : 'none';
      });
    }

    // Inicialización
    actualizarInterfaz();
  </script>
</body>
</html>
